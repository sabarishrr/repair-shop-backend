# Server
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/repair_shop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
# Secret must be Base64-encoded and at least 256 bits
jwt.secret=Y29tcHV0ZXJTaG9wUmVwYWlyU2VjcmV0S2V5Rm9ySldUU2lnbmluZ0lucHV0MjAyNA==
jwt.expiration=86400000

# Logging
logging.level.com.repairshop=DEBUG
